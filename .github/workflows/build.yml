name: Build
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.PG_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Unit and screenshot tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Sideload APK (fixed key)
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: photogate-apk
          path: app/build/outputs/apk/debug/*.apk
      # Play bundle, only when the upload key secrets are set (see docs/PLAY_STORE.md)
      - name: Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          PG_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PG_UPLOAD_KEYSTORE_BASE64 }}
          PG_UPLOAD_STORE_PASSWORD: ${{ secrets.PG_UPLOAD_STORE_PASSWORD }}
          PG_UPLOAD_KEY_ALIAS: ${{ secrets.PG_UPLOAD_KEY_ALIAS }}
          PG_UPLOAD_KEY_PASSWORD: ${{ secrets.PG_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$PG_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          PG_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks" gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: photogate-play-bundle
          path: app/build/outputs/bundle/release/*.aab
